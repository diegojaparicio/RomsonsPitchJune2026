    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .num,.stat .k,.mini .k,.donut-center .big,.opp-cell .k,.opp-now .k,.opp-late .k,.mk-imp .k,.tl-node{font-feature-settings:"tnum" 1;letter-spacing:-1.5px;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); background:#cfd6df; color:var(--ink);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #fit{ transform-origin:center center; }
  .stage{
    width:1280px; height:720px; position:relative; overflow:hidden;
    background:var(--page); box-shadow:0 30px 80px -30px rgba(0,0,0,.55); border-radius:2px;
  }
  /* ambient geometric background */
  .bg{position:absolute; inset:0; overflow:hidden; z-index:0;}
  .bg span{position:absolute; display:block;}
  .bg .g1{width:760px;height:760px;border-radius:46% 54% 60% 40%/52% 44% 56% 48%;
    background:linear-gradient(135deg,#e8edf3,#dde4ec); top:-260px; right:-200px; opacity:.9;}
  .bg .g2{width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #e6ebf2, #dde3ea); bottom:-220px; left:-160px;}
  .bg .g3{width:0;height:0;border-left:300px solid transparent;border-right:0 solid transparent;
    border-top:520px solid #e7ecf2; bottom:0; left:34%; opacity:.55; transform:skewX(-6deg);}
  .bg .g4{width:340px;height:340px;border-radius:38% 62% 47% 53%/49% 41% 59% 51%;
    background:#e9eef4; top:48%; right:-90px;}
  .bg .grid{position:absolute; inset:0;
    background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
    background-size:64px 64px; opacity:.35;}

  /* top + bottom chrome */
  .chrome-top{position:absolute; top:0; left:0; right:0; height:62px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 40px;}
  .logos{display:flex; align-items:center; gap:18px;}
  .hlogo{display:block; width:auto; object-fit:contain;}
  .hlogo[data-l="apamo"]{height:30px;}
  .hlogo[data-l="solmedica"]{height:15px;}
  .hlogo[data-l="romsons"]{height:18px;}
  .lg-divider{width:1px; height:26px; background:var(--line);}

  .top-right{display:flex; align-items:center; gap:14px;}
  .langbtn{display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--line);
    background:rgba(255,255,255,.7); backdrop-filter:blur(4px); border-radius:30px; padding:6px 6px 6px 13px;
    font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--navy); user-select:none; transition:.2s;}
  .langbtn:hover{border-color:var(--green); box-shadow:var(--shadow-sm);}
  .langbtn .pill{display:flex; gap:2px; background:var(--page2); border-radius:20px; padding:2px;}
  .langbtn .pill b{padding:3px 9px; border-radius:16px; font-size:10px; color:var(--muted); transition:.2s;}
  .langbtn .pill b.on{background:var(--navy); color:#fff;}

  .chrome-bot{position:absolute; bottom:0; left:0; right:0; height:54px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 40px;}
  .dots{display:flex; gap:7px; align-items:center;}
  .dots i{width:7px;height:7px;border-radius:50%; background:var(--line); cursor:pointer; transition:.25s;}
  .dots i.on{background:var(--green); width:22px; border-radius:5px;}
  .nav{display:flex; gap:8px;}
  .nav button{width:34px;height:34px;border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.8);
    cursor:pointer; color:var(--navy); font-size:15px; display:flex; align-items:center; justify-content:center; transition:.2s;}
  .nav button:hover{background:var(--navy); color:#fff; border-color:var(--navy);}
  .pagenum{font-size:11px; color:var(--muted); letter-spacing:1px; font-variant-numeric:tabular-nums;}
  .pagenum b{color:var(--navy);}

  /* slides */
  .slides{position:absolute; inset:0; z-index:10;}
  .slide{position:absolute; inset:0; padding:78px 56px 64px; opacity:0; visibility:hidden;
    transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; pointer-events:none;}
  .slide.active{opacity:1; visibility:visible; transform:none; pointer-events:auto;}

  .eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:11px; font-weight:800;
    letter-spacing:2.4px; text-transform:uppercase; color:var(--green-d);}
  .eyebrow::before{content:""; width:9px; height:9px; background:var(--green); display:block; transform:rotate(45deg);}
  .eyebrow.navy{color:var(--navy);} .eyebrow.navy::before{background:var(--navy);}
  h1.title{font-size:40px; line-height:1.08; font-weight:800; color:var(--navy); letter-spacing:-.5px;}
  h2.stitle{font-size:29px; line-height:1.12; font-weight:800; color:var(--navy); letter-spacing:-.4px;}
  .lede{font-size:14.5px; color:var(--muted); line-height:1.5; max-width:780px; margin-top:9px;}
  .slide-head{margin-bottom:18px;}
  .num{font-family:var(--serif);}

  .footer-note{position:absolute; bottom:60px; left:56px; right:56px; font-size:9.5px; color:var(--muted2);
    letter-spacing:.3px; border-top:1px solid var(--line); padding-top:7px;}

  /* generic cards */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px; box-shadow:var(--shadow-sm);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:13px;}
  .stat .k{font-family:var(--serif); font-size:38px; font-weight:700; color:var(--navy); line-height:1; letter-spacing:-1px;}
  .stat .k.green{color:var(--green-d);}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.4;}
  .chip{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.4px; padding:3px 9px; border-radius:20px;}
  .chip.rot{background:#e7f5ec; color:var(--green-dd);}
  .chip.tech{background:#e7edf6; color:var(--navy);}
  .chip.price{background:#eef1f5; color:var(--slate);}

  /* TITLE slide */
  .s-title{padding:0;}
  .title-wrap{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 70px;}
  .cover-lockup{display:flex; align-items:center; gap:30px; margin-top:24px; flex-wrap:wrap;}
  .cover-lockup .cl{display:block; object-fit:contain;}
  .cover-lockup .cl[data-l="apamo"]{height:120px;}
  .cover-lockup .cl[data-l="solmedica"]{height:46px;}
  .cover-lockup .cl-rom{height:58px;}
  .cover-lockup .cl-amp{font-size:46px; font-weight:300; color:var(--muted2); line-height:1;}
  .cover-lockup .cl-x{font-size:40px; font-weight:300; color:var(--green-d); line-height:1; margin:0 4px;}
  .tt-green{background:var(--green-d);} .tt-navy{background:var(--navy);} .tt-slate{background:var(--slate);}
  .title-meta{position:absolute; bottom:78px; left:70px; right:70px; display:flex; justify-content:space-between;
    align-items:flex-end; border-top:1px solid var(--line); padding-top:14px;}
  .title-meta .m{font-size:11px; color:var(--muted); letter-spacing:.4px;}
  .title-badge{position:absolute; top:120px; right:70px; width:240px;}

  /* message slide */
  .msg-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:6px;}
  .ask-bar{margin-top:18px; background:linear-gradient(100deg,var(--navy),var(--navy2)); color:#fff;
    border-radius:12px; padding:18px 22px; display:flex; align-items:center; gap:18px; box-shadow:var(--shadow);}
  .ask-bar .tag{font-size:10px; letter-spacing:2px; font-weight:800; text-transform:uppercase; color:var(--green);
    border:1px solid rgba(255,255,255,.25); padding:7px 12px; border-radius:7px; white-space:nowrap;}
  .ask-bar p{font-size:14.5px; line-height:1.45;}
  .ask-bar b{color:#fff;}

  /* market slide */
  .mk3{display:grid; grid-template-columns:1.32fr 1fr; gap:18px; align-items:stretch;}
  .ca-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px 18px 13px; box-shadow:var(--shadow-sm);}
  .ca-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px;}
  .ca-t{font-size:12px; font-weight:800; color:var(--navy); letter-spacing:.2px;}
  .ca-tot{font-size:10.5px; color:var(--green-d); font-weight:700;}
  .ca-rows{display:flex; flex-direction:column; gap:7px;}
  .ca-row{display:grid; grid-template-columns:80px 1fr 1fr 1fr; gap:9px; align-items:center;}
  .ca-row.hd .cn,.ca-row.hd .ca-cell{font-size:8.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted2); font-weight:800;}
  .ca-row.hd .ca-cell{justify-content:flex-start; background:none;}
  .ca-cn{font-size:11px; font-weight:700; color:var(--ink);}
  .ca-cell{position:relative; height:17px; border-radius:3px; background:var(--page2); display:flex; align-items:center; padding-left:7px; overflow:hidden;}
  .ca-cell .bar{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--slate2); opacity:.45;}
  .ca-cell .n{position:relative; font-size:10px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums;}
  .ca-row.es .ca-cn{color:var(--green-dd);}
  .ca-row.es .ca-cell{background:#e7f5ec;}
  .ca-row.es .ca-cell .bar{background:var(--green); opacity:.5;}
  .ca-leg{display:flex; gap:14px; margin-top:11px; padding-top:9px; border-top:1px solid var(--line);}
  .ca-leg span{font-size:9px; color:var(--muted);}
  .es-box{background:linear-gradient(160deg,#13243f,#0c1828); color:#fff; border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .es-flag{position:absolute; top:14px; right:16px; font-size:11px; font-weight:800; letter-spacing:1px; color:var(--green); border:1px solid rgba(31,157,87,.4); border-radius:6px; padding:3px 8px;}
  .es-title{font-size:13px; font-weight:800; letter-spacing:.2px; color:#fff; margin-bottom:12px;}
  .es-imp{background:linear-gradient(120deg,var(--green-d),var(--green-dd)); border-radius:11px; padding:13px 15px; margin-bottom:13px;}
  .es-imp .k{font-size:33px; font-weight:800; line-height:1;}
  .es-imp .l{font-size:10px; opacity:.92; margin-top:6px; line-height:1.4;}
  .es-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px 14px;}
  .es-grid .k{font-size:18px; font-weight:800; color:#fff; line-height:1;}
  .es-grid .l{font-size:9.5px; color:rgba(255,255,255,.7); margin-top:4px; line-height:1.3;}
  .impl-bar{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 18px; display:flex; align-items:center; gap:18px; box-shadow:var(--shadow-sm);}
  .impl-tag{font-size:10px; letter-spacing:1.6px; text-transform:uppercase; font-weight:800; color:var(--green-d); white-space:nowrap;}
  .impl-items{display:flex; gap:26px; flex:1;}
  .impl-items span{font-size:11px; color:var(--ink); line-height:1.4; padding-left:15px; position:relative; flex:1;}
  .impl-items span::before{content:""; position:absolute; left:0; top:5px; width:6px;height:6px;border-radius:50%;background:var(--green);}
  .impl-items span b{color:var(--navy);}

  /* strategy slide */
  .str-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .str-col{border-radius:14px; padding:20px 20px 18px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow);}
  .str-pub{background:linear-gradient(150deg,var(--navy),var(--navy2));}
  .str-priv{background:linear-gradient(150deg,var(--green-d),var(--green-dd));}
  .str-col .tag{font-size:10px; letter-spacing:1.8px; font-weight:800; text-transform:uppercase; opacity:.8;}
  .str-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px;}
  .sqlogo{display:block; object-fit:contain; opacity:.96;}
  .sqlogo[data-l="apamo-w"]{height:40px;}
  .sqlogo[data-l="solmedica-w"]{height:18px;}
  .str-col h3{font-size:19px; font-weight:800; margin:5px 0 2px;}
  .str-win{display:inline-flex; align-items:baseline; gap:7px; margin:12px 0 13px; padding:9px 14px;
    background:rgba(255,255,255,.13); border-radius:9px;}
  .str-win .w{font-family:var(--serif); font-size:21px; font-weight:700;}
  .str-win .x{font-size:11px; opacity:.85;}
  .str-col ul{list-style:none; display:flex; flex-direction:column; gap:8px;}
  .str-col li{font-size:11.5px; line-height:1.4; opacity:.95; padding-left:16px; position:relative;}
  .str-col li::before{content:"›"; position:absolute; left:0; top:-1px; font-weight:800; opacity:.7;}
  .str-foot{margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:13px 18px; font-size:12px; color:var(--ink); line-height:1.45; box-shadow:var(--shadow-sm);}
  .str-foot b{color:var(--green-d);}

  /* coverage map slide (dark) */
  .s-dark{background:radial-gradient(120% 120% at 70% 8%, #15294c 0%, #0c1828 58%, #091320 100%);}
  .s-dark .eyebrow.amber{color:#e6b34a;} .s-dark .eyebrow.amber::before{background:#e6b34a;}
  .s-dark .stitle.white{color:#fff;}
  .cov5{display:grid; grid-template-columns:1.12fr 1fr; gap:34px; align-items:center; margin-top:8px;}
  .cov5-map{width:100%;}
  .es-map{width:100%; height:auto; display:block; overflow:visible;}
  .es-map .dep{stroke:#0b1626; stroke-width:1; opacity:.94; transition:.2s;}
  .es-map .dep:hover{opacity:1; filter:brightness(1.12);}
  .pin .dot{fill:#eef4ff; stroke:#0b1626; stroke-width:.9;}
  .pin-pulse{fill:#cfe0ff; transform-origin:center; transform-box:fill-box; animation:pinPulse 2.6s ease-out infinite; animation-delay:var(--d,0s);}
  @keyframes pinPulse{0%{opacity:.7; r:3.5;} 70%{opacity:0; r:14;} 100%{opacity:0; r:14;}}
  @media (prefers-reduced-motion: reduce){.pin-pulse{animation:none; opacity:0;}}
  .pin .dot{filter:drop-shadow(0 0 2px rgba(255,255,255,.6));}
  .cov5-legend{display:flex; gap:22px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .cov5-legend .lg-i{display:flex; align-items:center; gap:8px; font-size:12.5px; color:rgba(255,255,255,.82); font-weight:600;}
  .cov5-legend .lg-i i{width:12px; height:12px; border-radius:50%; display:block;}
  .cov5-lede{font-size:14px; color:rgba(255,255,255,.74); line-height:1.55; margin-bottom:18px; max-width:440px;}
  .cov5-stats{border:1px solid rgba(255,255,255,.13); border-radius:16px; display:grid; grid-template-columns:1fr 1fr; background:rgba(255,255,255,.035); overflow:hidden;}
  .cov5-stats .st{padding:16px 24px;}
  .cov5-stats .st:nth-child(odd){border-right:1px solid rgba(255,255,255,.1);}
  .cov5-stats .st:nth-child(-n+4){border-bottom:1px solid rgba(255,255,255,.1);}
  .cov5-stats .k{font-size:39px; font-weight:800; line-height:1; letter-spacing:-1.5px;}
  .cov5-stats .k.b{color:#6ea0ff;} .cov5-stats .k.g{color:#e6b34a;}
  .cov5-stats .h{font-size:13.5px; font-weight:700; color:#fff; margin-top:7px;}
  .cov5-stats .s{font-size:10.5px; color:rgba(255,255,255,.5); margin-top:2px;}

  /* portfolio donut slide */
  .pf-wrap{display:grid; grid-template-columns:.95fr 1.15fr; gap:26px; align-items:center; margin-top:2px;}
  .donut-box{position:relative; display:flex; align-items:center; justify-content:center;}
  .donut-center{position:absolute; text-align:center; width:128px;}
  .donut-center .big{font-family:var(--serif); font-size:42px; font-weight:800; color:var(--navy); line-height:1;}
  .donut-center .lab{font-size:9px; letter-spacing:1.2px; color:var(--muted); text-transform:uppercase; margin-top:3px;}
  .donut-center .cov{margin-top:7px; font-size:9.5px; color:var(--green-d); font-weight:700; line-height:1.3;}
  .pf-list{display:flex; flex-direction:column; gap:9px;}
  .pf-item{display:grid; grid-template-columns:13px 1fr auto; gap:11px; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 13px; transition:.2s;}
  .pf-item:hover{box-shadow:var(--shadow-sm); transform:translateX(3px);}
  .pf-item .sw{width:13px;height:13px;border-radius:3px;}
  .pf-item .nm{font-size:12.5px; font-weight:700; color:var(--navy);}
  .pf-item .meta{font-size:10px; color:var(--muted); margin-top:2px;}
  .pf-item .right{text-align:right;}
  .pf-item .cnt{font-size:12px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
  .pf-item .cnt em{color:var(--green-d); font-style:normal;}
  .pf-bar{position:relative; height:6px; background:var(--page2); border-radius:3px; margin-top:6px; width:120px; margin-left:auto;}
  .pf-bar .fill{position:absolute; left:0; top:0; display:block; height:100%; border-radius:3px;}
  .pf-bar .t80{position:absolute; left:80%; top:-3px; bottom:-3px; width:0; border-left:2px dotted var(--navy); z-index:2;}
  .pf-bar .t80l{position:absolute; left:80%; top:-13px; transform:translateX(-50%); font-size:7px; font-weight:800; color:var(--navy); letter-spacing:.3px;}
  .pf-tip{position:absolute; top:6px; left:50%; transform:translateX(-50%); background:#fff; border:1px solid var(--line);
    box-shadow:var(--shadow); border-radius:9px; padding:9px 12px; font-size:11px; color:var(--ink); line-height:1.5;
    display:none; pointer-events:none; white-space:nowrap; z-index:20;}

  /* opportunity slide */
  .opp-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:4px;}
  .opp-cell{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:15px 13px; box-shadow:var(--shadow-sm);}
  .opp-cell .l{font-size:11px; color:var(--muted); line-height:1.3; min-height:30px;}
  .opp-cell .k{font-family:var(--serif); font-size:20px; font-weight:700; color:var(--navy); margin-top:9px; letter-spacing:-.5px;}
  .opp-band{margin-top:16px; display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  .opp-band.three{grid-template-columns:1fr 1fr 1fr;}
  .opp-tier{border-radius:13px; padding:17px 20px; box-shadow:var(--shadow); color:#fff; position:relative;}
  .opp-tier .ph{font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; font-weight:800; opacity:.85; margin-bottom:7px;}
  .opp-tier .k{font-size:32px; font-weight:800; line-height:1; letter-spacing:-1.5px;}
  .opp-tier .l{font-size:11px; opacity:.9; margin-top:7px; line-height:1.4;}
  .opp-tier.short{background:linear-gradient(135deg,#2f7d52,#1f9d57);}
  .opp-tier.mid{background:linear-gradient(135deg,var(--green-d),var(--green-dd));}
  .opp-tier.long{background:linear-gradient(135deg,var(--navy),var(--navy2));}
  .opp-tier.short .ph{color:#d8f3e3;} .opp-tier.mid .ph{color:#cdeede;} .opp-tier.long .ph{color:var(--green);}

  /* target products slide */
  .tp-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:13px; margin-top:4px;}
  .tp-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;}
  .tp-card h4{font-size:14px; color:var(--navy); font-weight:800; display:flex; align-items:center; gap:8px;}
  .tp-card h4 .d{width:9px;height:9px;border-radius:2px; transform:rotate(45deg);}
  .tp-card .prod{font-size:10.5px; color:var(--muted); margin:7px 0 10px; line-height:1.4;}
  .tp-tags{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:11px;}
  .tp-need{margin-top:auto; border-top:1px solid var(--line); padding-top:10px;}
  .tp-need .t{font-size:9px; letter-spacing:1.4px; text-transform:uppercase; color:var(--green-d); font-weight:800; margin-bottom:5px;}
  .tp-need p{font-size:11px; color:var(--ink); line-height:1.4;}

  /* process timeline slide */
  .tl-track{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:6px 0 4px; position:relative;}
  .tl-line{position:absolute; top:23px; left:8%; right:8%; height:2px; background:var(--line); z-index:0;}
  .tl-line i{position:absolute; left:0; top:0; height:100%; background:var(--green); width:0; transition:width .6s ease;}
  .tl-phase{position:relative; z-index:1; text-align:center; cursor:pointer; padding:0 6px;}
  .tl-node{width:46px;height:46px;border-radius:50%; margin:0 auto; background:#fff; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;
    color:var(--muted); transition:.25s;}
  .tl-phase.on .tl-node{background:var(--green-d); border-color:var(--green-d); color:#fff; transform:scale(1.08); box-shadow:0 8px 20px -8px rgba(31,157,87,.6);}
  .tl-phase .d{font-size:9.5px; color:var(--green-d); font-weight:800; letter-spacing:.5px; margin-top:7px;}
  .tl-phase .ph{font-size:12px; color:var(--navy); font-weight:700; margin-top:2px; line-height:1.2;}
  .tl-detail{margin-top:11px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:12px 18px; box-shadow:var(--shadow-sm); min-height:66px;}
  .tl-detail h4{font-size:13px; color:var(--green-d); font-weight:800; margin-bottom:5px;}
  .tl-detail p{font-size:11.5px; color:var(--ink); line-height:1.45;}
  .tl-exp{margin-top:12px; background:linear-gradient(120deg,#1d3357,#16284a); border-radius:12px; padding:12px 16px 14px; box-shadow:var(--shadow);}
  .tl-exp .exp-tag{font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase; font-weight:800; color:var(--amberx,#e0b24a); margin-bottom:9px;}
  .tl-exp .exp-cards{display:flex; align-items:stretch; gap:12px;}
  .exp-card{flex:1; display:flex; gap:12px; align-items:center; background:rgba(255,255,255,.06); border:1px solid rgba(224,178,74,.3); border-radius:10px; padding:11px 14px;}
  .exp-no{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:#e0b24a;color:#3a2c06;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .exp-h{font-size:12.5px;font-weight:800;color:#fff;}
  .exp-p{font-size:10px;color:rgba(255,255,255,.78);line-height:1.4;margin-top:2px;}
  .exp-arrow{display:flex;align-items:center;color:#e0b24a;font-size:22px;font-weight:700;}
  .tl-bottom{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .tl-obj{background:linear-gradient(120deg,var(--navy),var(--navy2)); color:#fff; border-radius:11px; padding:11px 16px;}
  .tl-risk{background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 16px;}
  .tl-obj .t,.tl-risk .t{font-size:9px; letter-spacing:1.8px; text-transform:uppercase; font-weight:800; margin-bottom:4px;}
  .tl-obj .t{color:var(--green);} .tl-risk .t{color:#c0392b;}
  .tl-obj p{font-size:10.5px; line-height:1.4; opacity:.95;} .tl-risk p{font-size:10.5px; line-height:1.4; color:var(--ink);}

  /* the ask slide */
  .ask-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; margin-top:4px;}
  .ask-cards{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .ask-c{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 15px; box-shadow:var(--shadow-sm);}
  .ask-c .ic{width:30px;height:30px;border-radius:8px; background:#e7f5ec; color:var(--green-dd); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin-bottom:9px;}
  .ask-c h4{font-size:12.5px; color:var(--navy); font-weight:800;}
  .ask-c p{font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:4px;}
  .ask-seg{background:linear-gradient(160deg,var(--navy),var(--navy2)); color:#fff; border-radius:13px; padding:20px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column;}
  .ask-seg .t{font-size:10px; letter-spacing:2px; text-transform:uppercase; font-weight:800; color:var(--green); margin-bottom:5px;}
  .ask-seg h3{font-size:18px; font-weight:800; margin-bottom:14px; line-height:1.2;}
  .ask-seg .seg{display:flex; align-items:center; gap:11px; padding:9px 0; border-top:1px solid rgba(255,255,255,.12);}
  .ask-seg .seg .r{width:30px;height:30px;border-radius:50%; border:2px solid var(--green); color:var(--green);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;}
  .ask-seg .seg .nm{font-size:12px; font-weight:700;}
  .ask-seg .seg .ds{font-size:9.5px; opacity:.75;}

  /* next steps slide */
  .ns-flow{display:flex; align-items:stretch; gap:0; margin-top:18px;}
  .ns-step{flex:1; position:relative; opacity:0; transform:translateY(16px); transition:opacity .5s, transform .5s;}
  .slide.active .ns-step.show{opacity:1; transform:none;}
  .ns-step .node{width:46px;height:46px;border-radius:50%; background:var(--green-d); color:#fff;
    font-family:var(--serif); font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin:0 auto 12px; box-shadow:0 10px 22px -10px rgba(31,157,87,.7); position:relative; z-index:2;}
  .ns-step .conn{position:absolute; top:23px; left:50%; width:100%; height:2px; background:var(--line); z-index:1;}
  .ns-step .conn i{display:block; height:100%; width:0; background:var(--green); transition:width .6s ease .2s;}
  .ns-step.show .conn i{width:100%;}
  .ns-step:last-child .conn{display:none;}
  .ns-card{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 13px; margin:0 7px; box-shadow:var(--shadow-sm); min-height:118px;}
  .ns-card h4{font-size:12px; color:var(--navy); font-weight:800; line-height:1.25; margin-bottom:7px;}
  .ns-card p{font-size:10.5px; color:var(--muted); line-height:1.4;}
  .live-arrow{margin-top:22px;}
  .la-march{animation:laMarch 1s linear infinite;}
  @keyframes laMarch{to{stroke-dashoffset:-26;}}
  .la-runner{animation:laRun 2.6s ease-in-out infinite;}
  @keyframes laRun{0%{transform:translateX(6px);}100%{transform:translateX(1116px);}}
  .la-pulse{transform-origin:center; animation:laPulse 2.6s ease-out infinite;}
  @keyframes laPulse{0%,100%{opacity:.5;r:7;}50%{opacity:0;r:16;}}
  @media (prefers-reduced-motion: reduce){.la-march,.la-runner,.la-pulse{animation:none;}}
  .ns-replay{margin-top:16px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:11px;
    font-weight:700; color:var(--green-d); border:1px solid var(--line); background:#fff; padding:8px 15px; border-radius:30px;}
  .ns-replay:hover{border-color:var(--green);}

  /* closing slide */
  .s-close{background:linear-gradient(150deg,var(--navy),var(--navy2)); padding:0;}
  .close-wrap{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 80px; z-index:5;}
  .close-wrap .eyebrow{color:var(--green);} .close-wrap .eyebrow::before{background:var(--green);}
  .close-wrap h1{font-size:50px; line-height:1.06; color:#fff; max-width:900px; margin:18px 0 16px; letter-spacing:-.5px;}
  .close-wrap h1 em{color:var(--green); font-style:normal;}
  .close-wrap p{font-size:15px; color:rgba(255,255,255,.8); max-width:720px; line-height:1.55;}
  .close-pillars{display:flex; gap:11px; margin-top:30px;}
  .close-pillars span{font-size:12px; font-weight:700; letter-spacing:.4px; color:#fff; border:1px solid rgba(255,255,255,.25);
    padding:11px 18px; border-radius:9px; background:rgba(255,255,255,.05);}
  .close-logos{position:absolute; bottom:64px; left:80px; right:80px; display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.15); padding-top:18px; z-index:5;}
  .close-logos .ll{display:flex; align-items:center; gap:30px;}
  .clogo{display:block; object-fit:contain;}
  .clogo[data-l="apamo-w"]{height:46px;}
  .clogo[data-l="solmedica-w"]{height:22px;}
  .clogo[data-l="romsons-w"]{height:26px;}
  .close-logos .lg-divider{background:rgba(255,255,255,.2);}
  .close-logos .cmeta{font-size:11px; color:rgba(255,255,255,.6); letter-spacing:.5px;}
  .close-bg{position:absolute; inset:0; overflow:hidden; z-index:1; opacity:.5;}
  .close-bg span{position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.08);}
  .close-bg .c1{width:600px;height:600px; right:-160px; top:-180px;}
  .close-bg .c2{width:420px;height:420px; right:-60px; top:-90px; border-color:rgba(31,157,87,.18);}
  .close-bg .c3{width:260px;height:260px; right:40px; top:10px;}

  .src{font-size:9px; color:var(--muted2); letter-spacing:.2px;}

  /* dark-mode chrome (closing slide) */
  .stage.onDark .chrome-top .lg-apamo .mk{color:#fff;}
  .stage.onDark .chrome-top .lg-sol .mk{color:#cfd8e3;}
  .stage.onDark .chrome-top .lg-rom .mk{color:#3fbf77;}
  .stage.onDark .chrome-top .lg-divider{background:rgba(255,255,255,.18);}
  .stage.onDark .langbtn{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff;}
  .stage.onDark .langbtn .pill{background:rgba(255,255,255,.12);}
  .stage.onDark .langbtn .pill b{color:rgba(255,255,255,.6);}
  .stage.onDark .langbtn .pill b.on{background:var(--green); color:#062313;}
  .stage.onDark .chrome-bot .pagenum{color:rgba(255,255,255,.55);}
  .stage.onDark .chrome-bot .pagenum b{color:#fff;}
  .stage.onDark .chrome-bot .nav button{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff;}
  .stage.onDark .chrome-bot .nav button:hover{background:var(--green); border-color:var(--green); color:#062313;}
  .stage.onDark .dots i{background:rgba(255,255,255,.22);}
  .stage.onDark .dots i.on{background:var(--green);}
</style>
</head>
<body>
<div id="fit">
  <div class="stage">

/* ===== Central America market data (mkt = est. medical-device market US$M; pop = millions) ===== */
const CA = [
  {es:"Guatemala", en:"Guatemala", h:48, c:2200, f:5000, esrow:false},
  {es:"Honduras", en:"Honduras", h:30, c:1400, f:3000, esrow:false},
  {es:"El Salvador", en:"El Salvador", h:60, c:800, f:2000, esrow:true},
  {es:"Nicaragua", en:"Nicaragua", h:31, c:250, f:1500, esrow:false},
  {es:"Costa Rica", en:"Costa Rica", h:30, c:250, f:1200, esrow:false},
  {es:"Panamá", en:"Panama", h:40, c:200, f:1000, esrow:false}
];
function renderCA(){
  const wrap=document.getElementById('caRows'); if(!wrap) return;
  wrap.innerHTML='';
  const mh=Math.max(...CA.map(c=>c.h)), mc=Math.max(...CA.map(c=>c.c)), mf=Math.max(...CA.map(c=>c.f));
  const fmt=n=> n>=1000 ? (n/1000).toFixed(n>=1000&&n%1000?1:0).replace('.0','')+'k' : n;
  const hd=document.createElement('div'); hd.className='ca-row hd';
  hd.innerHTML=`<div class="ca-cn">${lang==='es'?'País':'Country'}</div>
    <div class="ca-cell">Hospitales</div><div class="ca-cell">Clínicas</div><div class="ca-cell">Farmacias</div>`;
  if(lang==='en') hd.innerHTML=`<div class="ca-cn">Country</div><div class="ca-cell">Hospitals</div><div class="ca-cell">Clinics</div><div class="ca-cell">Pharmacies</div>`;
  wrap.appendChild(hd);
  CA.forEach(c=>{
    const row=document.createElement('div'); row.className='ca-row'+(c.esrow?' es':'');
    const hw=Math.round(c.h/mh*100), cw=Math.round(c.c/mc*100), fw=Math.round(c.f/mf*100);
    row.innerHTML=`<div class="ca-cn">${c[lang]}</div>
      <div class="ca-cell"><span class="bar" style="width:${hw}%"></span><span class="n">${c.h}</span></div>
      <div class="ca-cell"><span class="bar" style="width:${cw}%"></span><span class="n">${fmt(c.c)}</span></div>
      <div class="ca-cell"><span class="bar" style="width:${fw}%"></span><span class="n">${fmt(c.f)}</span></div>`;
    wrap.appendChild(row);
  });
}

}

const REG_COLORS=['#bcc6d1','#8593a4','#ccd4dd','#a6b2c0'];
function renderRegion(){
  const nameEl=document.getElementById('covName'); if(!nameEl) return;
  const r = REGIONS[lang][selReg];

  const dep = document.getElementById('covDeps'); dep.innerHTML='';

}

/* portfolio donut */
function arcPath(cx,cy,ri,ro,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
  const large=(a1-a0)>Math.PI?1:0;
  const [x0,y0]=p(ro,a0),[x1,y1]=p(ro,a1),[x2,y2]=p(ri,a1),[x3,y3]=p(ri,a0);
  return `M${x0} ${y0} A${ro} ${ro} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${ri} ${ri} 0 ${large} 0 ${x3} ${y3} Z`;
}
function renderPortfolio(){
  const totLines = PORT.reduce((a,b)=>a+b.total,0);
  const totCarried = PORT.reduce((a,b)=>a+b.carried,0);
  const svg = document.getElementById('donut');
  const cx=120, cy=120, ri=58, ro=92;
  let a=-Math.PI/2, html='';
  PORT.forEach((p,i)=>{
    const frac=p.total/totLines, a1=a+frac*2*Math.PI;
    html+=`<path d="${arcPath(cx,cy,ri,ro,a,a1)}" fill="${p.color}" stroke="#fff" stroke-width="2"
      class="pf-seg" data-i="${i}" style="cursor:pointer;transition:.2s"></path>`;
    a=a1;
  });
  svg.innerHTML=html;
  document.getElementById('pfTotal').textContent = totLines;
  const tpct = Math.round(totCarried/totLines*100);
  document.getElementById('pfCov').innerHTML = `<span style="color:var(--red)">${totCarried}/${totLines} · ${tpct}%</span> ${T[lang].s6_cov}`;
  // tooltip + hover
  const tip=document.getElementById('pfTip');
  svg.querySelectorAll('.pf-seg').forEach(seg=>{
    seg.addEventListener('mouseenter',e=>{
      const p=PORT[+seg.dataset.i];
      const share=Math.round(p.total/totLines*100), cov=Math.round(p.carried/p.total*100);
      svg.querySelectorAll('.pf-seg').forEach(s=>s.style.opacity=s===seg?'1':'.35');
      seg.style.transform='scale(1.03)'; seg.style.transformOrigin='120px 120px';
      tip.style.display='block';
      tip.innerHTML=`<b style="color:${p.color}">${p[lang]}</b><br>${share}% ${lang==='es'?'del catálogo':'of catalog'} · ${p.total} ${lang==='es'?'líneas':'lines'}<br><span style="color:${cov<50?'var(--red)':'var(--green-d)'}">${cov}% ${lang==='es'?'activado':'activated'}</span>`;
    });
    seg.addEventListener('mouseleave',()=>{
      svg.querySelectorAll('.pf-seg').forEach(s=>{s.style.opacity='1';s.style.transform='none';});
      tip.style.display='none';
    });
  });
  const list = document.getElementById('pfList'); list.innerHTML='';
  PORT.forEach(p=>{
    const pct = Math.round(p.carried/p.total*100);
    const red = pct<50;
    const tgt = p.target? `<i class="t80"></i><span class="t80l">80%</span>` : '';
    const el = document.createElement('div'); el.className='pf-item';
    el.innerHTML = `<span class="sw" style="background:${p.color}"></span>
      <div><div class="nm">${p[lang]}</div><div class="meta">${p[lang==='es'?'esd':'end']}</div></div>
      <div class="right"><div class="cnt"><em>${p.carried}</em> / ${p.total} · <b style="color:${red?'var(--red)':'var(--green-d)'}">${pct}%</b></div>
      <div class="pf-bar">${tgt}<i class="fill" style="width:${pct}%;background:${p.color}"></i></div></div>`;
    list.appendChild(el);
  });
}

/* target products */
function renderTP(){
  const grid = document.getElementById('tpGrid'); grid.innerHTML='';
  TP[lang].forEach(t=>{
    const el=document.createElement('div'); el.className='tp-card';
    const tags = t.tags.map(([c,l])=>`<span class="chip ${c}">${l}</span>`).join('');
    el.innerHTML = `<h4><span class="d" style="background:${t.c}"></span>${t.h}</h4>
      <div class="prod">${t.prod}</div>
      <div class="tp-tags">${tags}</div>
      <div class="tp-need"><div class="t">${lang==='es'?'Qué pedimos a Romsons':'What we ask of Romsons'}</div><p>${t.need}</p></div>`;
    grid.appendChild(el);
  });
}

/* next steps animation */
function playNS(){
  const steps=[...document.querySelectorAll('#nsFlow .ns-step')];
  steps.forEach(s=>s.classList.remove('show'));
  steps.forEach((s,i)=>setTimeout(()=>s.classList.add('show'), 180*i+150));
}
document.getElementById('nsReplay').addEventListener('click', playNS);

/* navigation */
const dotsWrap=document.getElementById('dots');
slides.forEach((s,i)=>{ const d=document.createElement('i'); d.addEventListener('click',()=>go(i)); dotsWrap.appendChild(d); });
function go(i){
  if(i<0||i>=TOTAL) return;
  cur=i;
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  [...dotsWrap.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  document.getElementById('curPage').textContent=String(i+1).padStart(2,'0');
  const dark = slides[i].classList.contains('s-close') || slides[i].classList.contains('s-dark');
  stage.classList.toggle('onDark', dark);
  updateHeaderLogos(dark);
  if(slides[i].id==='slideNS') playNS();
  if(i===8) renderPhase(0);
}
document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown') go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
});

/* responsive scale */
function fit(){
  const s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  document.getElementById('fit').style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);

/* init */
applyLang(); initLogos(); fit(); go(0);
